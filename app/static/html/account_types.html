<div class="page-header">
  <h1>🏷️ Account Types</h1>
  <button class="btn btn-primary" id="addTypeBtn">+ Add Account Type</button>
</div>

<div id="typeAlert"></div>

<p style="color:var(--text-muted);font-size:0.85rem;margin-bottom:1rem;line-height:1.6">
  Account তৈরি করার সময় এই type গুলো থেকে select করতে হবে। Dashboard এ CASH/BANK/DPS/FDR/PLOT
  নাম অনুযায়ী automatically Cash in Hand / In Bank / Savings / Plot totals এ যোগ হয়; অন্য নামের
  type কোনো dashboard total এ যোগ হয় না।
</p>

<div class="card">
  <table>
    <thead>
      <tr>
        <th>Name</th>
        <th>Created</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody id="typesBody">
      <tr><td colspan="3" class="loading">Loading...</td></tr>
    </tbody>
  </table>
</div>

<!-- Account Type Modal -->
<template id="tplTypeModal">
  <div class="modal" style="max-width:380px">
    <h2 id="typeModalTitle"></h2>
    <div id="typeModalAlert"></div>
    <div class="form-group">
      <label>Type Name</label>
      <input type="text" id="typeName" placeholder="Type name">
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" id="cancelType">Cancel</button>
      <button class="btn btn-primary" id="saveType">Save</button>
    </div>
  </div>
</template>

<!-- Delete Confirm Modal -->
<template id="tplTypeDeleteModal">
  <div class="modal" style="max-width:360px;text-align:center">
    <div style="font-size:3rem;margin-bottom:0.75rem">🗑️</div>
    <h2 style="margin-bottom:0.5rem">Delete Account Type?</h2>
    <p style="color:var(--text-muted);font-size:0.9rem;margin-bottom:1.5rem">
      You are about to delete<br>
      <strong id="deleteTypeName" style="color:var(--text)"></strong>
    </p>
    <div id="delTypeAlert"></div>
    <div style="display:flex;gap:0.75rem;justify-content:center">
      <button class="btn btn-outline" id="cancelDelType" style="min-width:110px">Cancel</button>
      <button class="btn btn-danger" id="confirmDelType" style="min-width:110px">Yes, Delete</button>
    </div>
  </div>
</template>
